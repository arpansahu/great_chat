[pytest]
DJANGO_SETTINGS_MODULE = great_chat.settings
python_files = test*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --ignore=venv
    --ignore=staticfiles
    --ignore=media
markers =
    ui: UI tests that require a running server and browser (deselect with '-m "not ui"')
    todo: Tests that are not yet implemented (deselect with '-m "not todo"')
    slow: Tests that take a long time to run
    integration: Integration tests
testpaths = .
